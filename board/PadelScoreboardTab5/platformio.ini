; M5Stack Tab5 Padel Scoreboard
; ESP32-P4 + ST7123 display. Wi-Fi and ESP-NOW go through the onboard ESP32-C6.
; Prefer ./scripts/build.sh (arduino-cli). This file is the optional PlatformIO path.

[env:m5stack_tab5]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
board = esp32-p4-evboard
framework = arduino
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.f_cpu = 360000000L
board_upload.flash_size = 16MB
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

platform_packages =
    platformio/tool-esptoolpy@~2.41100.0

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_DFU_ON_BOOT=0

lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git
